      <stop offset="0%" stop-color="#0066cc"></stop>
      <stop offset="100%" stop-color="#174ea6"></stop>
    </linearGradient>

    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
